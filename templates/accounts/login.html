{% extends 'base.html' %}
{% load crispy_forms_tags %}
{% load static %}

{% block title %}Login | BookNest{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-6 mx-auto">
            <div class="card border-0 shadow-sm rounded-4 overflow-hidden">
                <div class="card-body p-5">
                    <div class="text-center mb-4">
                        <div class="mb-3">
                            <i class="fas fa-book-open text-primary display-4"></i>
                        </div>
                        <h1 class="h3 fw-bold mb-2">Welcome Back</h1>
                        <p class="text-muted mb-0">Sign in to continue your reading journey</p>
                    </div>

                    <form method="POST" novalidate>
                        {% csrf_token %}
                        {{ form|crispy }}
                        <div class="d-flex justify-content-end mb-3">
                            <a href="{% url 'accounts:password_reset' %}" class="text-decoration-none text-secondary small fw-medium">
                                Forgot password?
                            </a>
                        </div>
                        <button type="submit" class="btn btn-primary rounded-pill w-100 py-2 fw-medium">
                            <i class="fas fa-sign-in-alt me-2"></i> Login
                        </button>
                    </form>

                    <hr class="my-4">

                    <p class="text-center mb-0">
                        Don't have an account?
                        <a href="{% url 'accounts:register' %}" class="text-primary fw-medium text-decoration-none">
                            Register
                        </a>
                    </p>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
